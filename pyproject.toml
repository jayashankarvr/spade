[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spade-forensics"
version = "0.2.1"
description = "Sub-Patch Analysis & Detection Engine - Image forensics for tiny fragment detection"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "SPADE Contributors"}
]
keywords = [
    "image-forensics",
    "fragment-detection",
    "photometric-invariance",
    "computer-vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pillow>=8.0.0",
    "scikit-learn>=0.24.0",
    "faiss-cpu>=1.7.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "mypy>=0.950",
    "ruff>=0.1.0",
    "httpx>=0.23.0",
]
api = [
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "python-multipart>=0.0.5",
]
# Benchmark harness (datasets, metrics, baselines)
bench = [
    "opencv-python-headless>=4.6.0",
    "scikit-image>=0.19.0",
    "kaggle>=1.5.0",
]
full = [
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "python-multipart>=0.0.5",
    "opencv-python-headless>=4.6.0",
    "scikit-image>=0.19.0",
    "kaggle>=1.5.0",
]

[project.scripts]
spade = "spade.cli:main"

[project.urls]
Homepage = "https://github.com/jayashankarvr/spade"
Repository = "https://github.com/jayashankarvr/spade"
Issues = "https://github.com/jayashankarvr/spade/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spade.descriptors" = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:.*importlib.*",
    "ignore::DeprecationWarning:.*SwigPy.*",
]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
